name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep NDK_VERSION and the platform/build-tools below (android jobs) in sync with
  # docker/Dockerfile (NDK_VERSION, PLATFORM_VERSION, BUILD_TOOLS_VERSION)
  NDK_VERSION: 29.0.14206865
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
    libssl-dev libayatana-appindicator3-dev librsvg2-dev
  FEDORA_DEPS: >-
    git gcc gcc-c++ make xz tar webkit2gtk4.1-devel openssl-devel curl wget file
    libappindicator-gtk3-devel librsvg2-devel libxdo-devel

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # tauri::generate_context! needs frontendDist (../build) to exist
      - run: npm run build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run tauri build -- --debug --no-bundle

  android:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install NDK and platform
        run: |
          # 36: tauri's Android library modules compile against platform 36
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run tauri android build -- --debug --apk --target aarch64

  # Builds the rpm against Fedora's own libraries and proves it installs with
  # dnf; the generic rpm in releases is built on Ubuntu and never tested there.
  fedora:
    needs: lint
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 60
    steps:
      # git first, so actions/checkout makes a real clone inside the container
      - name: Install Fedora dependencies
        run: |
          # shellcheck disable=SC2086
          dnf install -y --setopt=install_weak_deps=False $FEDORA_DEPS
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: fedora
      - run: npm ci
      - run: npm run tauri build -- --debug --bundles rpm
      - name: Install the rpm and check linked libraries
        run: |
          dnf install -y src-tauri/target/debug/bundle/rpm/*.rpm
          if ldd /usr/bin/tauri-todo | grep 'not found'; then
            echo "::error::tauri-todo links against libraries the rpm does not pull in"
            exit 1
          fi

  # Compiles the iOS/iPadOS app for the simulator, which needs no Apple signing
  # identity; signed device builds live in release.yml behind ENABLE_IOS.
  ios-simulator:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri ios init -- --ci
      - run: npm run tauri ios build -- --debug --target aarch64-sim --ci

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Image drift check: both compose targets must build (no push)
      - name: Build base target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: base
          push: false
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max
      - name: Build android target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: android
          push: false
          cache-from: |
            type=gha,scope=base
            type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max
