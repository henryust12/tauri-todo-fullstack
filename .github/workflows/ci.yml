name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with docker/Dockerfile (NDK build arg)
  NDK_VERSION: 29.0.14206865
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
    libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # tauri::generate_context! needs frontendDist (../build) to exist
      - run: npm run build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run tauri build -- --debug --no-bundle

  android:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install NDK and platform
        run: |
          sdkmanager "platforms;android-36" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run tauri android build -- --debug --apk --target aarch64

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Image drift check: both compose targets must build (no push)
      - name: Build base target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: base
          push: false
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max
      - name: Build android target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: android
          push: false
          cache-from: |
            type=gha,scope=base
            type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max
