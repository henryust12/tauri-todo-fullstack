name: Release

on:
  push:
    tags: ['v*.*.*']
  # Select a tag ref when dispatching manually; verify-version rejects branches
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep NDK_VERSION and the platform/build-tools below (android jobs) in sync with
  # docker/Dockerfile (NDK_VERSION, PLATFORM_VERSION, BUILD_TOOLS_VERSION)
  NDK_VERSION: 29.0.14206865
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
    libssl-dev libayatana-appindicator3-dev librsvg2-dev
  FEDORA_DEPS: >-
    git gcc gcc-c++ make xz tar webkit2gtk4.1-devel openssl-devel curl wget file
    libappindicator-gtk3-devel librsvg2-devel libxdo-devel

jobs:
  verify-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          conf_version="$(jq -r .version src-tauri/tauri.conf.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$conf_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $conf_version"
            exit 1
          fi
          echo "version=$conf_version" >> "$GITHUB_OUTPUT"

  # One job owns the draft release, so the build jobs only upload to it and do
  # not wait on each other (a missing macOS runner must not block Fedora/Android).
  draft-release:
    needs: verify-version
    permissions:
      contents: write # create the draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Create the draft release unless it exists
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '.[].tagName' | grep -qx "$GITHUB_REF_NAME"; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --verify-tag --title "Tauri Todo v$VERSION" --notes ""
          fi

  desktop:
    needs: [verify-version, draft-release]
    permissions:
      contents: write # create/update the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: --bundles deb,appimage,rpm
            rust_targets: ''
          - os: windows-latest
            args: --bundles msi,nsis
            rust_targets: ''
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}-${{ matrix.rust_targets }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      # Tauri tries to sign whenever these vars exist, even empty, so only export
      # the ones that are actually set (otherwise unsigned builds fail on macOS)
      - name: Export optional signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "$name<<EOF_$name"
                echo "$value"
                echo "EOF_$name"
              } >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tauri Todo v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: [verify-version, draft-release]
    permissions:
      contents: write # upload assets to the draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install NDK and platform
        run: |
          # 36: tauri's Android library modules compile against platform 36
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $LINUX_DEPS
      - name: Write signing config
        if: env.KEYSTORE_B64 != ''
        # Consumed by src-tauri/gen/android/app/build.gradle.kts
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - run: npm ci
      - run: npm run tauri android build -- --apk --aab
      - name: Upload to release
        run: |
          mapfile -t files < <(find src-tauri/gen/android/app/build/outputs \( -name '*.apk' -o -name '*.aab' \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No APK/AAB produced"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  # Fedora-native rpm, built against Fedora 43 libraries. The Ubuntu job's
  # generic rpm stays for other rpm distros (it needs an older glibc).
  fedora:
    needs: [verify-version, draft-release]
    permissions:
      contents: write # upload assets to the draft release
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Install Fedora dependencies
        run: |
          # shellcheck disable=SC2086
          dnf install -y --setopt=install_weak_deps=False $FEDORA_DEPS gh
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: fedora
      - run: npm ci
      - run: npm run tauri build -- --bundles rpm
      - name: Install the rpm and check linked libraries
        run: |
          dnf install -y src-tauri/target/release/bundle/rpm/*.rpm
          if ldd /usr/bin/tauri-todo | grep 'not found'; then
            echo "::error::tauri-todo links against libraries the rpm does not pull in"
            exit 1
          fi
      - name: Upload to release
        run: |
          asset="$RUNNER_TEMP/tauri-todo-${VERSION}-1.fc43.x86_64.rpm"
          cp src-tauri/target/release/bundle/rpm/*.rpm "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber --repo "$GITHUB_REPOSITORY"

  # iOS is opt-in: set repo variable ENABLE_IOS=true.
  # Required secrets:
  #   APPLE_DEVELOPMENT_TEAM      team ID
  #   IOS_CERTIFICATE             base64 .p12 (distribution certificate)
  #   IOS_CERTIFICATE_PASSWORD    .p12 password
  #   IOS_MOBILE_PROVISION        base64 .mobileprovision (App Store profile)
  #   APPLE_API_ISSUER            App Store Connect API issuer ID
  #   APPLE_API_KEY               App Store Connect API key ID
  #   APPLE_API_KEY_CONTENT       contents of the AuthKey_*.p8 file
  ios:
    if: vars.ENABLE_IOS == 'true'
    needs: [verify-version]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Import signing assets
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          cert="$RUNNER_TEMP/cert.p12"
          echo "$IOS_CERTIFICATE" | base64 -d > "$cert"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$cert" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          echo "$IOS_MOBILE_PROVISION" | base64 -d > "$profiles/build.mobileprovision"
          mkdir -p "$HOME/.private_keys"
          echo "$APPLE_API_KEY_CONTENT" > "$HOME/.private_keys/AuthKey_${APPLE_API_KEY}.p8"
      - run: npm ci
      # The Xcode project is not committed; generate it on the runner
      - run: npm run tauri ios init
      - run: npm run tauri ios build -- --export-method app-store-connect
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
