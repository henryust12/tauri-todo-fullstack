[advisories]
version = 2
# Only direct (workspace) deps fail on unmaintained/unsound. The current hits
# (proc-macro-error, zbus family, glib) are transitive via tauri's Linux stack
# and cannot be fixed here; cargo-audit still reports them as warnings.
unmaintained = "workspace"
unsound = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
]

# Skip license checks for unpublished workspace crates (needs publish = false).
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
